version: "0.5"

processes:
  postgresql:
    command: "./tools/nix/scripts/rundb.sh"
    namespace: "tools"
    shutdown:
      command: "pg_ctl stop -m fast"
    availability:
      restart: "always"
    readiness_probe:
      exec:
        command: "pg_isready -U postgres"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      exec:
        command: "pg_isready -U postgres"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  traefik:
    command: "traefik --configfile ./tools/traefik/traefik.yaml"
    namespace: "tools"
    availability:
      backoff_seconds: 1
      restart: "always"
    readiness_probe:
      http_get:
        host: "localhost"
        port: 9092
        scheme: "http"
        path: "/api/http/routers"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      http_get:
        host: "localhost"
        port: 9092
        scheme: "http"
        path: "/api/overview"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  server:
    command: "bun dev -F @repo/server"
    namespace: "api"
    # The server migrates on boot and immediately runs a sync, so it must not
    # start before PostgreSQL is accepting connections.
    depends_on:
      postgresql:
        condition: "process_healthy"
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: "localhost"
        port: 8080
        scheme: "http"
        path: "/health/ready"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      http_get:
        host: "localhost"
        port: 8080
        scheme: "http"
        path: "/health/live"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

  web:
    command: "bun dev -F @repo/web"
    namespace: "web"
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: "localhost"
        port: 5173
        scheme: "http"
        path: "/health/ready"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_probe:
      http_get:
        host: "localhost"
        port: 5173
        scheme: "http"
        path: "/health/live"
      initial_delay_seconds: 3
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3