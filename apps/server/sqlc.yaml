# sqlc turns internal/database/queries/*.sql into type-safe Go.
#
# The schema it type-checks against is the goose migration set itself, so a
# column that does not exist is a build-time error rather than a runtime one.
# Regenerate with `bun run generate -F @repo/server` (or `sqlc generate` here).
version: "2"
sql:
  - engine: postgresql
    schema: internal/database/migrations
    queries: internal/database/queries
    gen:
      go:
        package: sqlc
        out: internal/database/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_json_tags: false
        # Hand the application plain `time.Time` / `*time.Time` instead of
        # pgtype wrappers. pgx scans both; only one of them is pleasant to use
        # in domain code and in tests.
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
